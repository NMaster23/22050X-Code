[package]
name = "vision_tuner"
version = "0.1.0"
edition = "2021"
authors = ["22050X Robotics Engineering"]
description = "Windows Hello Active NIR + RGB Markerless Camera-in-the-Loop LemLib PID Tuning and Stress-Testing Engine for VEX V5 22050X"

[dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Capture",
    "Media_Capture_Frames",
    "Media_Devices",
    "Media_MediaProperties",
    "Graphics_Imaging",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
] }
nokhwa = { version = "0.10", features = ["input-native"] }
image = "0.25"
imageproc = "0.25"
nalgebra = "0.33"
argmin = "0.10"
argmin-math = { version = "0.4", features = ["vec", "primitives"] }
rand = "0.8"
serialport = "4.5"
cobs = "0.2"
crc = "3.2"
bytemuck = { version = "1.18", features = ["derive"] }
crossbeam-channel = "0.5"
rayon = "1.10"
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"
plotters = "0.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = false
